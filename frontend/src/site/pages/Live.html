<!doctype html><html lang="en"><head><!--IC_HEAD--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspire College — Live Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..500&amp;family=Outfit:wght@300..700&amp;family=Plus+Jakarta+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ic{--bg:#ffffff;--bg2:#f6f3fd;--glass:#f8f6fc;--glass2:rgba(22,15,36,.06);--line:rgba(22,15,36,.09);--ink:#160f24;--muted:#5f5670;--dim:#6f6a7a;--acc:#6d28d9;--acc2:#6d28d9;--accs:rgba(109,40,217,.1);--ok:#047857;--nav:rgba(255,255,255,.82);min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.55 Geist,"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.ic *{box-sizing:border-box;min-width:0}
.ic a{color:inherit}
.ic button{font-family:inherit}
.ic :focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:12px}
.ic h1,.ic h2,.ic h3{margin:0;font-weight:600;letter-spacing:-.045em;line-height:1.03}
.mono{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.grad{background:linear-gradient(100deg,var(--ink) 15%,var(--acc) 60%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1280px;margin:0 auto;padding:0 max(4vw,16px)}
.hdr{position:sticky;top:12px;z-index:60;padding:0 12px}
.hbar{max-width:1280px;margin:0 auto;height:60px;padding:0 8px 0 16px;display:flex;align-items:center;gap:10px;border-radius:999px;background:var(--nav);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:650;letter-spacing:-.03em;font-size:17px;flex:none}
.mark{width:30px;height:30px;border-radius:10px;background:conic-gradient(from 200deg,#a78bfa,#6d28d9,#f0abfc,#a78bfa);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.hnav{display:flex;gap:2px;margin:0 auto}
.hnav a{display:flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border-radius:999px;color:var(--muted);font-size:14.5px;font-weight:500;text-decoration:none}
.hnav a:hover,.hnav a.on{background:var(--glass2);color:var(--ink)}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25);animation:pulse 1.6s infinite;flex:none}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:0;cursor:pointer}
.btn.p{background:#6d28d9;color:#fff;box-shadow:0 16px 36px -14px rgba(109,40,217,.7)}
.ic a.btn.p:hover{color:#fff}
.btn.g{background:var(--glass2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:42px;padding:0 18px;font-size:14px}
.hero{position:relative;padding:72px 0 36px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(60% 70% at 70% 0%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(60% 70% at 70% 0%,#000 10%,transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;width:800px;height:520px;right:-120px;top:-240px;background:radial-gradient(closest-side,rgba(139,92,246,.14),transparent);pointer-events:none}
.hero>*{position:relative;z-index:1}
.htop{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.htitle{font-size:clamp(44px,6.4vw,92px);letter-spacing:-.06em;line-height:.95;margin-top:18px}
.hsub{color:var(--muted);font-size:18px;max-width:52ch;margin:18px 0 0}
.status{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:32px;overflow:hidden;margin-top:40px}
.kpis div{background:var(--bg2);padding:20px}
.kpis b{display:block;font-size:clamp(24px,2.4vw,34px);font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted);font-size:12.5px}
.kpis em{display:block;font-style:normal;font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:11.5px;color:var(--ok);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:14px}
.panel{border-radius:32px;background:#fff;border:1px solid var(--line);box-shadow:0 30px 70px -44px rgba(42,14,92,.35);padding:22px;min-height:0}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c4{grid-column:span 4}.c8{grid-column:span 8}.c6{grid-column:span 6}.c12{grid-column:span 12}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h3{font-size:20px;letter-spacing:-.03em}
.tog{display:flex;padding:3px;border-radius:999px;background:var(--glass2)}
.tog button{border:0;background:none;color:var(--muted);font:600 12.5px Geist,"Plus Jakarta Sans",system-ui;min-height:32px;padding:0 12px;border-radius:999px;cursor:pointer}
.tog button.on{background:#160f24;color:#fff}
.lg{display:grid;gap:10px}
.lr{display:grid;grid-template-columns:30px 40px minmax(0,1fr) 1.2fr 90px 52px;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--glass)}
.lr .r{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:13px;color:var(--dim)}
.lr .sw{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#0b0614}
.lr b{font-weight:600;font-size:15px}
.lr small{display:block;color:var(--muted);font-size:12.5px}
.trk{height:8px;border-radius:8px;background:var(--glass2);overflow:hidden}
.trk i{display:block;height:100%;border-radius:8px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.lr .xp{text-align:right;font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:13px}
.lr .mv{text-align:right;font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:12px}
.up{color:var(--ok)}.dn{color:#fb7185}.eq{color:var(--dim)}
.feed{display:grid;gap:8px}
.fi{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:18px;background:var(--bg2);animation:in .6s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
.fi .a{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.fi p{margin:0;font-size:14px;line-height:1.35;flex:1}
.fi small{display:block;color:var(--dim);font-size:11.5px;font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif}
.fi .pts{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:12.5px;color:var(--ok);white-space:nowrap}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;align-items:end;margin-bottom:14px}
.pod{border-radius:28px;padding:16px;text-align:center;background:var(--glass2);border:1px solid var(--line)}
.pod .av{box-shadow:0 10px 24px -12px rgba(42,14,92,.5);width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}
.pod b{display:block;font-weight:600}
.pod small{color:var(--muted);font-size:12.5px;display:block}
.pod .rk{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:12px;color:var(--dim)}
.pod.g1{padding-top:26px;background:linear-gradient(180deg,rgba(251,191,36,.18),var(--glass));border-color:rgba(251,191,36,.35)}
.tl{display:grid;gap:6px}
.tl div{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:16px;background:var(--glass);font-size:14px}
.tl span:first-child{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;color:var(--dim);font-size:12.5px}
.tl span:last-child{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:12.5px;color:var(--muted)}
.classes{display:grid;gap:10px}
.cl{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:10px;border-radius:20px;background:var(--glass)}
.cl .th{width:72px;height:56px;border-radius:16px;background-size:cover;background-position:center;position:relative}
.cl .th i{position:absolute;left:6px;top:6px}
.cl b{display:block;font-weight:600;font-size:15px}
.cl small{color:var(--muted);font-size:12.5px}
.cl em{font-style:normal;font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:12px;color:var(--ok);white-space:nowrap}
.quests{display:grid;gap:12px}
.qst{padding:16px;border-radius:24px;background:var(--glass)}
.qst .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qst b{font-weight:600}
.qst small{color:var(--muted);font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:12px}
.qst .trk{margin-top:10px;height:10px}
.qst p{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.badges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.bd{border-radius:24px;padding:14px 10px;text-align:center;background:var(--glass);border:1px solid var(--line)}
.bd .ic2{width:52px;height:52px;border-radius:20px;margin:0 auto 10px;display:grid;place-items:center;color:#0b0614}
.bd b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.bd small{display:block;font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:11px;color:var(--dim);margin-top:4px}
.rew{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rw{border-radius:24px;padding:16px;background:var(--glass)}
.rw b{display:block;font-size:26px;letter-spacing:-.04em;font-weight:600;font-variant-numeric:tabular-nums}
.rw small{color:var(--muted);font-size:13px}
.how{display:grid;gap:6px}
.how div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:16px;background:var(--glass);font-size:14.5px}
.how span:last-child{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ok)}
.join{margin-top:14px;border-radius:40px;padding:clamp(28px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;background:radial-gradient(80% 140% at 100% 0%,rgba(139,92,246,.18),transparent 60%),var(--bg2);border:1px solid var(--line)}
.join h2{font-size:clamp(30px,3.6vw,48px)}
.join p{color:var(--muted);margin:10px 0 0;max-width:52ch}
.note{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:11.5px;color:var(--dim);margin:14px 0 0;letter-spacing:.02em}
footer{padding:40px 0 110px;font-size:13px;color:var(--dim)}
.mbar{display:none}
@media(max-width:1100px){.hnav{display:none}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.c7,.c5,.c4,.c8,.c6{grid-column:span 12}.badges{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.hdr{top:8px;padding:0 8px}.hbar{height:54px}.logo>span:not(.mark){display:none}.hbar .btn{margin-left:auto}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.htitle{font-size:44px}
.lr{grid-template-columns:24px 34px minmax(0,1fr) 70px;gap:8px}.lr .trkw,.lr .mv{display:none}.lr .sw{width:34px;height:34px}
.rew{grid-template-columns:minmax(0,1fr)}
.mbar{display:flex;position:fixed;left:10px;right:10px;bottom:12px;z-index:70;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:999px;background:#160f24;color:#fff}
.mbar p{margin:0;flex:1;font-size:13px;line-height:1.25}.mbar p b{display:block;font-size:14px}
.mbar a{background:#7c3aed;color:#fff;border-radius:999px;min-height:40px;padding:0 18px;display:flex;align-items:center;text-decoration:none;font-weight:600;font-size:14px}}
@media(prefers-reduced-motion:reduce){.ic *{animation:none!important;transition:none!important}}

.ic{font-family:Geist,"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;letter-spacing:-.005em}
.ic h1,.ic h2,.ic h3,.ic h4{font-family:Geist,Outfit,Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-weight:600;letter-spacing:-.035em}
.ser{font-family:inherit!important;font-style:normal!important;font-weight:300!important;letter-spacing:-.03em}
.ic button,.ic input,.ic select,.ic textarea{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif}

@media(max-width:380px){.ic .wrap{padding:0 14px}.ic h1{font-size:34px!important;letter-spacing:-.04em}.ic .btn{padding:0 18px}}
@supports(padding:max(0px)){.tabbar,.mtab{padding-bottom:calc(14px + env(safe-area-inset-bottom))!important}.applybar,.mbar{bottom:calc(12px + env(safe-area-inset-bottom))}}

@media(horizontal-viewport-segments:2){.htop{display:grid!important;grid-template-columns:env(viewport-segment-width 0 0,1fr) env(viewport-segment-width 1 0,1fr)!important;column-gap:calc(env(viewport-segment-left 1 0,0px) - env(viewport-segment-right 0 0,0px))!important}.ic .wrap{padding:0 24px}}
@media(vertical-viewport-segments:2){.hdr{top:0}}
</style>
<style id="finish">
/* Finishing layer: typography, rhythm, focus, micro-interactions */
.ic h1,.ic h2,.ic h3,.ic .h2,.ic .htitle{text-wrap:balance}
.ic p,.ic li,.ic small,.ic .lead{text-wrap:pretty}
.ic{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.ic .price,.ic .xam b,.ic .xdue b,.ic .kpis b,.ic .pa,.ic .ffacts b,.ic .xsum,.ic .fr b{font-variant-numeric:tabular-nums}
.ic .chips,.ic .filters,.ic .schoolpick,.ic .xlv,.ic .lvls{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.ic ::selection{background:#ddd6fe;color:#1a1033}
.ic :focus-visible{outline:3px solid #8b5cf6;outline-offset:3px;border-radius:14px}
.ic .btn{position:relative;overflow:hidden;isolation:isolate;-webkit-tap-highlight-color:transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s}
.ic .btn:active{transform:scale(.97)}
.ic .btn.p::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.ic .btn.p:hover::after{transform:translateX(120%)}
.ic .btn.p:hover{box-shadow:0 16px 34px -14px rgba(109,40,217,.75)}
.ic .eyebrow{line-height:1.3}
.ic .eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:currentColor;opacity:.7}
.ic img{max-width:100%}
.ic .lead{max-width:min(60ch,100%)}
@supports (animation-timeline:scroll()){.ic::after{content:"";position:fixed;left:0;top:0;height:3px;width:100%;z-index:300;transform-origin:0 50%;background:linear-gradient(90deg,#7c3aed,#c084fc,#f472b6);animation:icprog linear both;animation-timeline:scroll(root);pointer-events:none}@keyframes icprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}}
@media(max-width:760px){
 .ic .band{padding:56px 0}
 .ic .h2{font-size:clamp(30px,8.4vw,40px);line-height:1.04;letter-spacing:-.04em}
 .ic .lead{font-size:16.5px;line-height:1.55}
 .ic .eyebrow{font-size:12px;margin-bottom:12px}
 .ic .cta{gap:10px}
 .ic .hero .cta .btn,.ic .final .cta .btn,.ic .fres .fact .btn{flex:1 1 100%;justify-content:center}
 .ic .cup small{display:block;font-size:12px;line-height:1.35;margin-top:4px}
 .ic .cup b{font-size:30px}
 .ic .ticks{gap:10px 16px}
}
@media(max-width:360px){.ic .h2{font-size:29px}.ic .htitle{font-size:34px!important}.ic .wrap{padding-left:14px;padding-right:14px}}
@media(min-width:1600px){.ic .wrap{max-width:1320px}}
@media(prefers-reduced-motion:reduce){.ic::after{display:none}.ic .btn.p::after{display:none}}
@media(max-width:760px){.ic a.logo{min-height:44px;display:inline-flex;align-items:center}}</style>
<style id="brand">.brand{display:inline-flex!important;align-items:center;gap:12px;text-decoration:none}.brand .lg{height:28px;width:auto;display:block;flex:none}.brand .lg-w{display:none}.ic.dk .brand .lg-c{display:none}.ic.dk .brand .lg-w{display:block}.brand.onlyw .lg-w{display:block}.brand .lgsub{padding-left:12px;border-left:1px solid currentColor;opacity:.75;font-size:14px;font-weight:550;line-height:1.1;white-space:nowrap;display:inline!important}.ic .logo.brand>span.lgsub{display:inline!important}@media(max-width:760px){.brand .lg{height:24px}.brand .lgsub{display:none!important}}@media(max-width:380px){.brand .lg{height:20px}}</style>
<style>html{scroll-behavior:smooth}</style></head><body><template id="dc-tpl">

<div class="ic">
<header class="hdr"><div class="hbar">
  <a class="logo brand" href="Main.dc.html"><img class="lg lg-c" src="/assets/b902c0e1d0b5e18b502f5249ee882e83.webp" alt="Inspire College" width="139" height="30"><img class="lg lg-w" src="/assets/dad81691bc200060ed05886b0e6b2ea9.webp" alt="" aria-hidden="true" width="139" height="30"><span class="lgsub">Live campus</span></a>
  <nav class="hnav" aria-label="Main"><a href="Main.dc.html#programs">Programmes</a><a class="on" href="#top"><i class="live-dot" aria-hidden="true"></i>Live campus</a><a href="/portal">Portal</a></nav>
  <a class="btn p sm" href="Program.dc.html">Apply now</a>
</div></header>

<section class="hero" id="top"><div class="wrap">
  <div class="htop">
    <div><span class="status"><i class="live-dot" aria-hidden="true"></i>LIVE · UPDATED {{clock}}</span>
      <h1 class="htitle">The campus, <span class="grad">in real time.</span></h1>
      <p class="hsub">Every class, quiz, streak and coffee across Inspire Brain, live. First names only, never personal details.</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn p" href="Program.dc.html">Join the campus</a><a class="btn g" href="/portal">Student login</a></div>
  </div>
  <div class="kpis" aria-live="polite">
    <div><b>{{k.learning}}</b><small>Learning right now</small><em>▲ live</em></div>
    <div><b>{{k.xp}}</b><small>XP earned today</small><em>+{{k.xpMin}} last min</em></div>
    <div><b>{{k.classes}}</b><small>Live classes now</small><em>{{k.joined}} joined</em></div>
    <div><b>{{k.subs}}</b><small>Assignments today</small><em>94% on time</em></div>
    <div><b>{{k.coffee}}</b><small>Coffees this week</small><em>Inspire Hours</em></div>
    <div><b>{{k.streak}}</b><small>Longest streak (days)</small><em>Kavindu, Computing</em></div>
  </div>
</div></section>

<div class="wrap">
  <div class="grid">
    <section class="panel c7" aria-label="School league">
      <div class="ph"><h3>School league</h3><div class="tog" role="group" aria-label="Period"><template data-sc="for" list="{{periods}}" as="p" hint-placeholder-count="3"><button type="button" class="{{p.cls}}" onClick="{{p.pick}}" aria-pressed="{{p.on}}">{{p.t}}</button></template></div></div>
      <div class="lg"><template data-sc="for" list="{{league}}" as="l" hint-placeholder-count="6"><div class="lr"><span class="r">{{l.r}}</span><span class="sw" style="background:{{l.c}}">{{l.ab}}</span><span><b>{{l.n}}</b><small>{{l.st}} students active</small></span><span class="trk trkw"><i style="width: {{l.w}}; background: {{l.c}}"></i></span><span class="xp">{{l.xp}} XP</span><span class="{{l.mvc}}">{{l.mv}}</span></div></template></div>
    </section>
    <section class="panel c5" aria-label="Live activity">
      <div class="ph"><h3>Live activity</h3><span class="mono">auto-updating</span></div>
      <div class="feed"><template data-sc="for" list="{{feed}}" as="f" hint-placeholder-count="7"><div class="fi"><span class="a" style="background:{{f.c}}">{{f.i}}</span><p>{{f.t}}<small>{{f.w}}</small></p><span class="pts">{{f.p}}</span></div></template></div>
    </section>

    <section class="panel c5" aria-label="Top learners">
      <div class="ph"><h3>Top learners · this week</h3><span class="mono">all schools</span></div>
