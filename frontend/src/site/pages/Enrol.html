<!doctype html><html lang="en"><head><!--IC_HEAD--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspire College — Enrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..500&amp;family=Outfit:wght@300..700&amp;family=Plus+Jakarta+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ic{--bg:#fff;--soft:#f6f3fd;--card:#fff;--ink:#160f24;--muted:#5f5670;--line:rgba(22,15,36,.1);--act:#6d28d9;--act-ink:#5b21b6;--act-soft:rgba(109,40,217,.1);--coffee:#b45309;--ok:#047857;--shadow:0 24px 60px -36px rgba(42,14,92,.28);min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.55 Geist,"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ic *{box-sizing:border-box;min-width:0}
.ic a{color:inherit}
.ic a:hover{color:var(--act-ink)}
.ic button,.ic input,.ic select{font-family:inherit}
.ic :focus-visible{outline:3px solid var(--act);outline-offset:3px;border-radius:12px}
.ic h1,.ic h2,.ic h3{margin:0;font-weight:650;letter-spacing:-.04em;line-height:1.05;text-wrap:balance}
.ser{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.02em;color:var(--act-ink)}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.tin{max-width:1240px;margin:0 auto;padding:12px max(4vw,16px);display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:750;letter-spacing:-.03em;font-size:18px;flex:none}
.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#4c1d95);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.lvl{flex:1;display:flex;align-items:center;gap:12px;max-width:520px;margin-left:auto}
.lvl .b{width:42px;height:42px;border-radius:16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:grid;place-items:center;font-weight:800;color:#3b1d00;flex:none;font-size:14px}
.lvl .t{flex:1}
.lvl .t small{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted)}
.trk{height:10px;border-radius:10px;background:var(--soft);overflow:hidden;margin-top:5px}
.trk b{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#7c3aed,#c026d3);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.close{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);text-decoration:none;font-size:20px;flex:none}
.main{max-width:1240px;margin:0 auto;padding:clamp(24px,4vw,48px) max(4vw,16px) 120px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(24px,3vw,40px);align-items:start}
.quests{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px;padding:0;list-style:none}
.quests li{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:620;color:var(--muted)}
.quests li i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:750;background:var(--card);border:1.5px solid var(--line)}
.quests li.done{color:var(--ok)}
.quests li.done i{background:var(--ok);color:#fff;border-color:var(--ok)}
.quests li.cur{background:var(--ink);color:#fff}
.quests li.cur i{background:#fff;color:var(--ink);border-color:#fff}
.h1{font-size:clamp(34px,4vw,52px);margin-bottom:8px}
.sub{color:var(--muted);margin:0 0 24px}
.form-stack{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
label.l{display:grid;gap:6px;font-size:14px;font-weight:600}
.ic input[type=text],.ic input[type=email],.ic input[type=tel],.ic select{font-size:16px;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:18px;min-height:54px;padding:12px 16px;width:100%}
.ic input:focus,.ic select:focus{outline:none;border-color:var(--act);background:var(--card)}
.who{display:flex;gap:8px;padding:4px;border-radius:999px;background:var(--soft);width:max-content;max-width:100%}
.who button{border:0;background:transparent;color:var(--muted);font-weight:620;font-size:14px;min-height:42px;padding:0 18px;border-radius:999px;cursor:pointer}
.who button.on{background:var(--card);color:var(--ink);box-shadow:0 4px 14px -6px rgba(42,14,92,.35)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:28px;border:2px solid transparent;background:var(--soft);cursor:pointer;color:var(--ink);font:inherit}
.pick b{font-weight:640;font-size:16px;line-height:1.3}
.pick small{color:var(--muted);font-size:14px}
.pick em{font-style:normal;font-size:12px;font-weight:700;color:var(--coffee)}
.pick.on{border-color:var(--act);background:var(--card);box-shadow:var(--shadow)}
.drop{border:2px dashed rgba(109,40,217,.35);border-radius:32px;padding:34px;text-align:center;background:var(--soft)}
.drop b{display:block;font-size:18px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px 18px;border-radius:28px;border:2px solid transparent;background:var(--soft);cursor:pointer;color:var(--ink);font:inherit}
.opt b{display:block;font-weight:630}
.opt small{color:var(--muted);font-size:14px}
.opt .pr{margin-left:auto;font-weight:680;white-space:nowrap;text-align:right}
.opt .pr small{display:block;font-weight:500}
.opt.on{border-color:var(--act);background:var(--card)}
.opt .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.on .rad{border:7px solid var(--act)}
.leg{font-size:14px;font-weight:650;margin:6px 0 -4px}
.tag{font-size:11.5px;font-weight:750;padding:3px 8px;border-radius:999px;background:rgba(4,120,87,.12);color:var(--ok);margin-left:6px;vertical-align:2px}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:6px 0;cursor:pointer;font:inherit;color:var(--muted);font-size:15px}
.check i{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;color:#fff;font-size:13px;font-weight:800}
.check.on i{background:var(--act);border-color:var(--act)}
.err{color:#be123c;font-size:15px;margin:0;min-height:22px}
.nav2{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:999px;font-weight:650;font-size:16px;text-decoration:none;border:0;cursor:pointer}
.btn.p{background:var(--act);color:#fff;box-shadow:0 16px 36px -14px rgba(109,40,217,.75)}
.ic a.btn.p:hover{color:#fff}
.btn.s{background:var(--soft);color:var(--ink)}
.btn.k{background:var(--ink);color:#fff}
.sum{background:var(--card);border-radius:36px;padding:20px;border:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:92px}
.sart{aspect-ratio:16/9;border-radius:24px;background:linear-gradient(140deg,#4c1d95,#7c3aed 55%,#c026d3);margin-bottom:14px;position:relative;overflow:hidden}
.sart{background:url(/assets/4a27b48337542cf553b90736f49b0fab.webp) center/cover}
.sart span{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);color:#2a0e5c;font-size:12px;font-weight:650;padding:5px 11px;border-radius:999px}
.sl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.sl span:first-child{color:var(--muted)}
.sl.t{border-top:1px solid var(--line);margin-top:6px;padding-top:14px;font-size:20px;font-weight:680}
.sl.t span:first-child{color:var(--ink)}
.perk{display:flex;gap:12px;align-items:center;margin-top:14px;padding:14px;border-radius:24px;background:rgba(180,83,9,.08)}
.perk i{width:42px;height:42px;border-radius:16px;background:var(--coffee);color:#fff;display:grid;place-items:center;font-style:normal;flex:none}
.perk b{display:block;color:var(--coffee);font-size:15px}
.perk small{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:18px;padding:10px 14px;margin-top:12px}
.win{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,48px);align-items:start}
.wallet{background:linear-gradient(140deg,rgba(120,53,15,.92),rgba(180,83,9,.86) 60%,rgba(124,58,237,.85)),url(/assets/cc98c59ea3aa77fdab17fc42aea86db1.webp) center/cover}
.trophy{width:96px;height:96px;border-radius:36px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:grid;place-items:center;margin-bottom:22px;box-shadow:0 20px 40px -16px rgba(245,158,11,.7)}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.badges span{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--soft);font-weight:620;font-size:14px}
.badges span i{width:28px;height:28px;border-radius:50%;background:var(--act);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.wallet{border-radius:40px;padding:26px;background:linear-gradient(140deg,#78350f,#b45309 60%,#7c3aed);color:#fff}
.wallet h3{font-size:24px}
.wallet p{color:rgba(255,255,255,.86);margin:6px 0 0;font-size:15px}
.cg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin:18px 0}
.cg i{aspect-ratio:1;border-radius:7px;background:rgba(255,255,255,.2)}
.cg i.f{background:#fff}
.qr{width:96px;height:96px;border-radius:18px;background:#fff;padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;flex:none}
.qr i{background:#160f24;border-radius:2px}
.qr i.o{background:transparent}
.ref{margin-top:16px;border-radius:32px;padding:20px;background:var(--soft)}
.ref b{display:block;font-size:18px}
@media(max-width:900px){.main,.win{grid-template-columns:minmax(0,1fr)}.sum{position:static}.lvl{max-width:none}}
@media(max-width:560px){.row2,.grid2{grid-template-columns:minmax(0,1fr)}.quests li span{display:none}.quests li{padding:8px}.logo>span:not(.mark){display:none}.btn{padding:0 20px}.nav2 .btn{flex:1}}

.ic{font-family:Geist,"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;letter-spacing:-.005em}
.ic h1,.ic h2,.ic h3,.ic h4{font-family:Geist,Outfit,Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-weight:600;letter-spacing:-.035em}
.ser{font-family:inherit!important;font-style:normal!important;font-weight:300!important;letter-spacing:-.03em}
.ic button,.ic input,.ic select,.ic textarea{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif}

@media(max-width:430px){.nav2 .btn{font-size:14px;padding:0 14px;white-space:nowrap}}
@media(max-width:380px){.nav2{flex-direction:column-reverse}.nav2 .btn{width:100%;justify-content:center}.form-stack{grid-template-columns:minmax(0,1fr)}.who{width:100%}.who button{flex:1;padding:0 10px}.ic .wrap{padding:0 14px}.ic h1{font-size:34px!important;letter-spacing:-.04em}.ic .btn{padding:0 18px}}
@supports(padding:max(0px)){.tabbar,.mtab{padding-bottom:calc(14px + env(safe-area-inset-bottom))!important}.applybar,.mbar{bottom:calc(12px + env(safe-area-inset-bottom))}}

@media(horizontal-viewport-segments:2){.main,.win{display:grid!important;grid-template-columns:env(viewport-segment-width 0 0,1fr) env(viewport-segment-width 1 0,1fr)!important;column-gap:calc(env(viewport-segment-left 1 0,0px) - env(viewport-segment-right 0 0,0px))!important}.ic .wrap{padding:0 24px}}
@media(vertical-viewport-segments:2){.hdr{top:0}}
</style>
<style id="finish">
/* Finishing layer: typography, rhythm, focus, micro-interactions */
.ic h1,.ic h2,.ic h3,.ic .h2,.ic .htitle{text-wrap:balance}
.ic p,.ic li,.ic small,.ic .lead{text-wrap:pretty}
.ic{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.ic .price,.ic .xam b,.ic .xdue b,.ic .kpis b,.ic .pa,.ic .ffacts b,.ic .xsum,.ic .fr b{font-variant-numeric:tabular-nums}
.ic .chips,.ic .filters,.ic .schoolpick,.ic .xlv,.ic .lvls{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.ic ::selection{background:#ddd6fe;color:#1a1033}
.ic :focus-visible{outline:3px solid #8b5cf6;outline-offset:3px;border-radius:14px}
.ic .btn{position:relative;overflow:hidden;isolation:isolate;-webkit-tap-highlight-color:transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s}
.ic .btn:active{transform:scale(.97)}
.ic .btn.p::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.ic .btn.p:hover::after{transform:translateX(120%)}
.ic .btn.p:hover{box-shadow:0 16px 34px -14px rgba(109,40,217,.75)}
.ic .eyebrow{line-height:1.3}
.ic .eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:currentColor;opacity:.7}
.ic img{max-width:100%}
.ic .lead{max-width:min(60ch,100%)}
@supports (animation-timeline:scroll()){.ic::after{content:"";position:fixed;left:0;top:0;height:3px;width:100%;z-index:300;transform-origin:0 50%;background:linear-gradient(90deg,#7c3aed,#c084fc,#f472b6);animation:icprog linear both;animation-timeline:scroll(root);pointer-events:none}@keyframes icprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}}
@media(max-width:760px){
 .ic .band{padding:56px 0}
 .ic .h2{font-size:clamp(30px,8.4vw,40px);line-height:1.04;letter-spacing:-.04em}
 .ic .lead{font-size:16.5px;line-height:1.55}
 .ic .eyebrow{font-size:12px;margin-bottom:12px}
 .ic .cta{gap:10px}
 .ic .hero .cta .btn,.ic .final .cta .btn,.ic .fres .fact .btn{flex:1 1 100%;justify-content:center}
 .ic .cup small{display:block;font-size:12px;line-height:1.35;margin-top:4px}
 .ic .cup b{font-size:30px}
 .ic .ticks{gap:10px 16px}
}
@media(max-width:360px){.ic .h2{font-size:29px}.ic .htitle{font-size:34px!important}.ic .wrap{padding-left:14px;padding-right:14px}}
@media(min-width:1600px){.ic .wrap{max-width:1320px}}
@media(prefers-reduced-motion:reduce){.ic::after{display:none}.ic .btn.p::after{display:none}}
</style>
<style id="brand">.brand{display:inline-flex!important;align-items:center;gap:12px;text-decoration:none}.brand .lg{height:28px;width:auto;display:block;flex:none}.brand .lg-w{display:none}.ic.dk .brand .lg-c{display:none}.ic.dk .brand .lg-w{display:block}.brand.onlyw .lg-w{display:block}.brand .lgsub{padding-left:12px;border-left:1px solid currentColor;opacity:.75;font-size:14px;font-weight:550;line-height:1.1;white-space:nowrap;display:inline!important}.ic .logo.brand>span.lgsub{display:inline!important}@media(max-width:760px){.brand .lg{height:24px}.brand .lgsub{display:none!important}}@media(max-width:380px){.brand .lg{height:20px}}</style>
<style>html{scroll-behavior:smooth}</style></head><body><template id="dc-tpl">

<div class="ic">
<header class="top"><div class="tin">
  <a class="logo brand" href="Main.dc.html"><img class="lg lg-c" src="/assets/b902c0e1d0b5e18b502f5249ee882e83.webp" alt="Inspire College" width="139" height="30"><img class="lg lg-w" src="/assets/dad81691bc200060ed05886b0e6b2ea9.webp" alt="" aria-hidden="true" width="139" height="30"><span class="lgsub">Enrol</span></a>
  <div class="lvl" aria-label="Your level"><span class="b">L{{level}}</span><span class="t"><small><span>{{levelName}}</span><span>{{xp}} / 500 XP</span></small><span class="trk"><b style="width: {{xpW}}"></b></span></span></div>
  <a class="close" href="Main.dc.html" aria-label="Save and exit">×</a>
</div></header>

<div class="main">
<template data-sc="if" value="{{notDone}}" hint-placeholder-val="{{ true }}">
<section>
  <ol class="quests" aria-label="Enrolment steps"><template data-sc="for" list="{{quests}}" as="q" hint-placeholder-count="4"><li class="{{q.cls}}"><i>{{q.n}}</i><span>{{q.t}} · +{{q.xp}} XP</span></li></template></ol>

  <template data-sc="if" value="{{s1}}" hint-placeholder-val="{{ true }}">
    <h1 class="h1">Let's get you <span class="ser">started.</span></h1>
    <p class="sub">Your progress saves as you go. Come back anytime.</p>
    <div class="form-stack">
      <div class="who" role="group" aria-label="Who is enrolling"><button type="button" class="{{meCls}}" onClick="{{asMe}}">I'm the student</button><button type="button" class="{{parCls}}" onClick="{{asPar}}">I'm a parent</button></div>
      <label class="l">{{nameLabel}}<input type="text" value="{{name}}" onInput="{{setName}}" autocomplete="name"></label>
      <div class="row2"><label class="l">Email<input type="email" value="{{email}}" onInput="{{setEmail}}" autocomplete="email"></label><label class="l">Mobile / WhatsApp<input type="tel" value="{{phone}}" onInput="{{setPhone}}" autocomplete="tel"></label></div>
      <p class="err" role="alert">{{err}}</p>
      <div class="nav2"><a class="btn s" href="Aptitude.dc.html">Not sure? AI match</a><button class="btn k" type="button" onClick="{{next1}}">Continue · +50 XP</button></div>
    </div>
  </template>

  <template data-sc="if" value="{{s2}}" hint-placeholder-val="{{ false }}">
    <h1 class="h1">Pick your <span class="ser">course.</span></h1>
    <p class="sub">Choose a programme, then a course. Coffee perks are shown on each.</p>
    <div class="grid2"><template data-sc="for" list="{{courses}}" as="c" hint-placeholder-count="10"><button type="button" class="{{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}"><b>{{c.n}}</b><small>{{c.d}} · {{c.feeTxt}}</small><em>{{c.cupTxt}}</em></button></template></div>
    <div class="nav2"><button class="btn s" type="button" onClick="{{back}}">Back</button><button class="btn k" type="button" onClick="{{next2}}">Continue · +100 XP</button></div>
  </template>

  <template data-sc="if" value="{{s3}}" hint-placeholder-val="{{ false }}">
    <h1 class="h1">Upload your <span class="ser">results.</span></h1>
    <p class="sub">Optional. Add O/L or A/L results now, or later in Inspire Brain.</p>
    <div class="drop">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
      <b>{{uploadTitle}}</b><p class="sub" style="margin:6px 0 16px">PDF, JPG or PNG, up to 10 MB</p>
      <button class="btn s" type="button" onClick="{{doUpload}}">Choose file</button>
    </div>
    <div class="nav2"><button class="btn s" type="button" onClick="{{back}}">Back</button><button class="btn k" type="button" onClick="{{next3}}">{{next3Txt}}</button></div>
  </template>

  <template data-sc="if" value="{{s4}}" hint-placeholder-val="{{ false }}">
    <h1 class="h1">Reserve &amp; <span class="ser">pay.</span></h1>
    <p class="sub">Choose the plan that fits. Pay securely by PayHere.</p>
    <div class="form-stack">
      <div class="leg">Payment plan</div>
      <template data-sc="for" list="{{plans}}" as="p" hint-placeholder-count="3"><button type="button" class="{{p.cls}}" onClick="{{p.pick}}" aria-pressed="{{p.on}}"><span class="rad" aria-hidden="true"></span><span><b>{{p.t}}<template data-sc="if" value="{{p.hot}}" hint-placeholder-val="{{ false }}"><span class="tag">Most popular</span></template></b><small>{{p.d}}</small></span><span class="pr">{{p.pr}}<small>{{p.prs}}</small></span></button></template>
      <div class="leg">Payment method</div>
      <template data-sc="for" list="{{methods}}" as="m" hint-placeholder-count="2"><button type="button" class="{{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}"><span class="rad" aria-hidden="true"></span><span><b>{{m.t}}</b><small>{{m.d}}</small></span></button></template>
      <button type="button" class="{{schCls}}" onClick="{{toggleSch}}" aria-pressed="{{sch}}"><i>✓</i><span><b style="color:var(--ink)">Apply for the LKR 200,000 scholarship</b><br>For the first 20 students. An advisor confirms eligibility before any fee changes.</span></button>
      <label class="l">Referral code (optional)<input type="text" value="{{refCode}}" onInput="{{setRef}}" placeholder="e.g. FRIEND-2027"></label>
      <button type="button" class="{{agCls}}" onClick="{{toggleAg}}" aria-pressed="{{agree}}"><i>✓</i><span>I agree to the Inspire College Terms &amp; Conditions and Refund Policy.</span></button>
      <p class="err" role="alert">{{err}}</p>
      <div class="nav2"><button class="btn s" type="button" onClick="{{back}}">Back</button><button class="btn p" type="button" onClick="{{pay}}">{{payTxt}}</button></div>
      <p class="note">Design preview: no payment is taken. On the live site this opens a PayHere payment link.  Amounts follow the published fee schedule and are confirmed by an advisor.</p>
    </div>
  </template>
</section>

<aside class="sum" aria-label="Order summary">
