<style>
body{margin:0}
.ic{--bg:#f6f3fd;--bg2:#f6f3fd;--glass:#f8f6fc;--glass2:rgba(22,15,36,.06);--line:rgba(22,15,36,.09);--ink:#160f24;--muted:#5f5670;--dim:#6f6a7a;--acc:#6d28d9;--acc2:#6d28d9;--accs:rgba(109,40,217,.1);--ok:#047857;--warm:#b45309;min-height:100vh;background:var(--bg);color:var(--ink);font:15.5px/1.5 Geist,"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-wrap:wrap;align-items:flex-start}
.ic *{box-sizing:border-box;min-width:0}
.ic a{color:inherit}
.ic button,.ic input{font-family:inherit}
.ic :focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:12px}

.side{flex:1 1 230px;max-width:250px;padding:18px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);min-height:100vh}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:650;letter-spacing:-.03em;font-size:17px;padding:4px 10px 18px}
.mark{width:30px;height:30px;border-radius:10px;background:conic-gradient(from 200deg,#a78bfa,#6d28d9,#f0abfc,#a78bfa);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.nv{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:500 14.5px Geist,"Plus Jakarta Sans",system-ui;cursor:pointer;text-align:left}
.nv:hover{background:var(--glass)}
.nv.on{background:var(--glass2);color:var(--ink)}
.nv em{font-style:normal;font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--acc2);color:#fff}

.chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:13.5px}

.c{background:#fff;border-radius:30px;padding:20px;border:1px solid var(--line);box-shadow:0 24px 60px -44px rgba(42,14,92,.35)}

.streak span i{display:block;height:34px;border-radius:10px;background:var(--glass2);margin-bottom:4px}
.streak span i.f{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
.wal{border:0;color:#fff;background:linear-gradient(140deg,rgba(7,6,11,.82),rgba(120,53,15,.75)),url(/_blob/cc98c59ea3aa77fdab17fc42aea86db1) center/cover}
.cg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin:12px 0}
.cg i{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.2)}
.cg i.f{background:#fbbf24}
.lvl{display:flex;gap:12px;align-items:center}
.lvl .b{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:grid;place-items:center;color:#2b1600;font-weight:800;flex:none}
.lvl small{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif}
.chatwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;min-height:520px}
.chs{display:grid;gap:4px;align-content:start}
.chs button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:16px;border:0;background:transparent;color:var(--ink);cursor:pointer;font:inherit}
.chs button.on{background:var(--glass2)}
.chs button i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:#0b0614;flex:none}
.chs b{display:block;font-weight:600;font-size:14px}
.chs small{display:block;color:var(--muted);font-size:12px}
.thread{display:flex;flex-direction:column;gap:10px;min-height:0}
.thread .hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.msgs{display:flex;flex-direction:column;gap:8px;flex:1}
.m{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14.5px;background:var(--glass2)}
.m small{display:block;font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:10.5px;color:var(--dim);margin-bottom:2px}
.m.me{background:var(--acc2);color:#fff;margin-left:auto}
.m.me small{color:rgba(255,255,255,.7)}
.sug{display:flex;gap:6px;flex-wrap:wrap}
.sug button{border:1px solid var(--line);background:transparent;border-radius:999px;font:500 13px Geist,"Plus Jakarta Sans",system-ui;min-height:38px;padding:0 13px;cursor:pointer;color:var(--ink)}
.lb{display:grid;gap:6px}
.lr{display:grid;grid-template-columns:30px 38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-radius:16px;background:var(--glass)}

.lr .r{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:12.5px;opacity:.8}
.lr .a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px}
.lr span:last-child{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:13px}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--glass2)}
.seg button{border:0;background:none;color:var(--muted);font:600 12.5px Geist,"Plus Jakarta Sans",system-ui;min-height:32px;padding:0 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:#160f24;color:#fff}
.store{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.it{border-radius:28px;padding:18px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.it .ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#0b0614;margin-bottom:6px}
.it b{font-weight:600}
.it small{color:var(--muted)}
.it .pr{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:13px;color:var(--ok);margin-top:auto;padding-top:6px}
.it .btn{margin-top:6px}
.mk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.li{border-radius:28px;overflow:hidden;background:var(--glass);border:1px solid var(--line)}
.li .im{aspect-ratio:4/3;background-size:cover;background-position:center}
.li .bd{padding:14px 16px 16px}
.li b{display:block;font-weight:600}
.li small{color:var(--muted);font-size:13px}
.li .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.li .ft span{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-size:13px}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pl{border-radius:28px;padding:18px;background:var(--glass);border:1.5px solid var(--line);cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.pl.on{border-color:var(--acc)}
.pl b{display:block;font-weight:600}
.pl .a{display:block;font-size:24px;font-weight:600;letter-spacing:-.03em;margin:6px 0 2px}
.pl small{color:var(--muted);font-size:13px}
.sched{display:grid;gap:6px;margin-top:14px}
.sched div{display:flex;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--glass);font-size:14px}
.sched span:last-child{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif}
.paid{color:var(--ok)}
.ref{border:0;color:#fff;background:radial-gradient(100% 140% at 100% 0%,rgba(240,171,252,.35),transparent 60%),linear-gradient(140deg,#2a0e5c,#6d28d9)}
.code{display:flex;align-items:center;gap:10px;margin-top:14px;padding:6px 6px 6px 16px;border-radius:999px;background:rgba(255,255,255,.12);font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:.06em}
.code .btn{margin-left:auto}
.mtab{display:none}
@media(min-width:761px) and (max-width:1060px){.side{flex:0 0 200px;max-width:200px}.content{flex:1 1 0;min-width:0}}
@media(max-width:1060px){.g,.store,.mk,.plan{grid-template-columns:repeat(2,minmax(0,1fr))}.s3{grid-column:span 2}.chatwrap{grid-template-columns:minmax(0,1fr)}.chs{grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);overflow-x:auto}}
@media(max-width:760px){.side{display:none}.g,.store,.mk,.plan{grid-template-columns:minmax(0,1fr)}.s2,.s3{grid-column:auto}.content{padding-top:16px}.tb .hide{display:none}
.mtab{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 6px 14px}
.mtab button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font:500 11px Geist,"Plus Jakarta Sans",system-ui;color:var(--muted);min-height:50px;justify-content:center;cursor:pointer}
.mtab button.on{color:var(--ink)}
.mtab i{width:6px;height:6px;border-radius:50%;background:transparent}
.mtab button.on i{background:var(--acc)}}

.ic{font-family:Geist,"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;letter-spacing:-.005em}
.ic h1,.ic h2,.ic h3,.ic h4{font-family:Geist,Outfit,Geist,"Plus Jakarta Sans",system-ui,sans-serif;font-weight:600;letter-spacing:-.035em}
.ser{font-family:inherit!important;font-style:normal!important;font-weight:300!important;letter-spacing:-.03em}
.ic button,.ic input,.ic select,.ic textarea{font-family:Geist,"Plus Jakarta Sans",system-ui,sans-serif}

@media(max-width:380px){.ic .wrap{padding:0 14px}.ic h1{font-size:34px!important;letter-spacing:-.04em}.ic .btn{padding:0 18px}}
@supports(padding:max(0px)){.tabbar,.mtab{padding-bottom:calc(14px + env(safe-area-inset-bottom))!important}.applybar,.mbar{bottom:calc(12px + env(safe-area-inset-bottom))}}

@media(horizontal-viewport-segments:2){.chatwrap{display:grid!important;grid-template-columns:env(viewport-segment-width 0 0,1fr) env(viewport-segment-width 1 0,1fr)!important;column-gap:calc(env(viewport-segment-left 1 0,0px) - env(viewport-segment-right 0 0,0px))!important}.ic .wrap{padding:0 24px}}
@media(vertical-viewport-segments:2){.hdr{top:0}}
</style>
<style id="finish">
/* Finishing layer: typography, rhythm, focus, micro-interactions */
.ic h1,.ic h2,.ic h3,.ic .h2,.ic .htitle{text-wrap:balance}
.ic p,.ic li,.ic small,.ic .lead{text-wrap:pretty}
.ic{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.ic .price,.ic .xam b,.ic .xdue b,.ic .kpis b,.ic .pa,.ic .ffacts b,.ic .xsum,.ic .fr b{font-variant-numeric:tabular-nums}
.ic .chips,.ic .filters,.ic .schoolpick,.ic .xlv,.ic .lvls{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.ic ::selection{background:#ddd6fe;color:#1a1033}
.ic :focus-visible{outline:3px solid #8b5cf6;outline-offset:3px;border-radius:14px}

.ic .btn:active{transform:scale(.97)}
.ic .btn.p::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.ic .btn.p:hover::after{transform:translateX(120%)}
.ic .btn.p:hover{box-shadow:0 16px 34px -14px rgba(109,40,217,.75)}
.ic .eyebrow{line-height:1.3}
.ic .eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:currentColor;opacity:.7}
.ic img{max-width:100%}
.ic .lead{max-width:min(60ch,100%)}
@supports (animation-timeline:scroll()){.ic::after{content:"";position:fixed;left:0;top:0;height:3px;width:100%;z-index:300;transform-origin:0 50%;background:linear-gradient(90deg,#7c3aed,#c084fc,#f472b6);animation:icprog linear both;animation-timeline:scroll(root);pointer-events:none}@keyframes icprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}}
@media(max-width:760px){
 .ic .band{padding:56px 0}
 .ic .h2{font-size:clamp(30px,8.4vw,40px);line-height:1.04;letter-spacing:-.04em}

 .ic .hero .cta .btn,.ic .final .cta .btn,.ic .fres .fact .btn{flex:1 1 100%;justify-content:center}

 .ic .cup b{font-size:30px}
 .ic .ticks{gap:10px 16px}
}
@media(max-width:360px){.ic .h2{font-size:29px}.ic .htitle{font-size:34px!important}.ic .wrap{padding-left:14px;padding-right:14px}}
@media(min-width:1600px){.ic .wrap{max-width:1320px}}
@media(prefers-reduced-motion:reduce){.ic::after{display:none}.ic .btn.p::after{display:none}}
</style>
