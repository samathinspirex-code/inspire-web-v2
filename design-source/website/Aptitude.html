<style>

<style>html{scroll-behavior:smooth}</style></head><body><template id="dc-tpl">

    <template data-sc="if" value="{{canBack}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{back}}" style="margin-top:22px;border:0;background:none;color:var(--muted);font:600 15px "Plus Jakarta Sans",system-ui;cursor:pointer;min-height:44px">← Previous question</button></template>
  </section>
  <aside class="side" aria-label="Live AI reading">
    <h3>Your strengths, live</h3>
    <p>Our AI updates your match with every answer.</p>
    <div class="rows"><template data-sc="for" list="{{bars}}" as="b" hint-placeholder-count="6"><div class="row"><span>{{b.label}}</span><span class="trk"><b style="width: {{b.w}}"></b></span><span>{{b.pct}}</span></div></template></div>
    <div class="badges"><template data-sc="for" list="{{badges}}" as="g" hint-placeholder-count="3"><span class="{{g.cls}}">{{g.t}}</span></template></div>

</template>
<template data-sc="if" value="{{done}}" hint-placeholder-val="{{ false }}">

    <section class="hero-r">
      <span class="tag">Your best match · +50 XP bonus</span>
      <h2>You're built for the {{top.school}}.</h2>
      <p>{{top.why}}</p>
      <div class="big">{{top.pct}}<small>match</small></div>
      <div class="cta"><a class="btn w" href="{{top.first}}">Enrol with my match</a><button class="btn g" type="button" onClick="{{restart}}">Retake</button></div>
    </section>
    <section>
      <h3 style="font-size:24px">What you could become</h3>
      <p class="cnote">Typical pay for roles this path leads to. Sri Lanka: monthly gross, middle 80% of earners. Abroad: average yearly salary.</p>
      <div class="car"><div class="car-h"><span>Career</span><span>Sri Lanka / month</span><span>Abroad / year</span></div><template data-sc="for" list="{{top.careers}}" as="c" hint-placeholder-count="3"><div class="car-r"><b>{{c.role}}</b><span class="lk">{{c.lk}}</span><span class="gl">{{c.gl}}</span></div></template></div>
      <p class="csrc">Sources: Paylab Sri Lanka salary survey (2025–26); Remote Recruiting Report global averages (USD); UK figures from ONS ASHE 2025 and England teacher pay scales from Sept 2025. Pay depends on experience, employer and country. Indicative only.</p>
      <h3 style="font-size:24px;margin-top:28px">Recommended for you</h3>
      <div class="rec"><template data-sc="for" list="{{top.progs}}" as="p" hint-placeholder-count="3"><a href="{{p.href}}"><span>{{p.n}}<small>{{p.d}}</small></span><em>{{p.f}}</em></a></template></div>
      <div class="ai"><i aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3z"></path></svg></i><span><b>AI insight:</b> {{top.tip}}</span></div>
      <h3 style="font-size:20px;margin-top:28px">Your full profile</h3>
      <div class="rows"><template data-sc="for" list="{{bars}}" as="b" hint-placeholder-count="6"><div class="row"><span>{{b.label}}</span><span class="trk"><b style="width: {{b.w}}"></b></span><span>{{b.pct}}</span></div></template></div>
      <p style="color:var(--muted);font-size:13.5px;margin-top:16px">A guide, not a test score. An advisor will go through your result with you.</p>
    </section>
  </div>
</template>
</div>
</div>
