<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Inspire College OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed sidebar + fluid content column of white cards on a soft grey ground; sidebar becomes a scrolling top bar on phones. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#F2F2F5; --fg:#1D1D1F; --fg-2:#48484D; --muted:#6E6E73; --line:#E5E5EA;
  --accent:#3F007C; --accent-2:#6D28D9; --fill:#3F007C; --on-fill:#FFFFFF; --tint:#F5EFFC; --tint-strong:#E4D6F7;
  --warn:#C2410C; --warn-fg:#9A3412; --warn-tint:#FDEEE3; --warn-strong:#FBD9C4;
  --good:#1F6B45; --good-tint:#E8F5EE; --grid:#EDEDF0; --sample-bg:#FFF4E5; --sample-fg:#8A4B00;
  --series-3:#C9B3EE; --series-dim:#AEAEB2;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fg:#F5F5F7; --fg-2:#D1D1D6; --muted:#98989D; --line:#38383A;
  --accent:#C4A6F5; --accent-2:#A47BEF; --fill:#7C3AED; --on-fill:#FFFFFF; --tint:#251B36; --tint-strong:#3B2A5C;
  --warn:#F28A4B; --warn-fg:#FFB088; --warn-tint:#3A2318; --warn-strong:#5A2E17;
  --good:#6FD39B; --good-tint:#17301F; --grid:#2C2C2E; --sample-bg:#3A2A10; --sample-fg:#FFC970;
  --series-3:#6B4FA0; --series-dim:#636366; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fg:#F5F5F7; --fg-2:#D1D1D6; --muted:#98989D; --line:#38383A;
  --accent:#C4A6F5; --accent-2:#A47BEF; --fill:#7C3AED; --on-fill:#FFFFFF; --tint:#251B36; --tint-strong:#3B2A5C;
  --warn:#F28A4B; --warn-fg:#FFB088; --warn-tint:#3A2318; --warn-strong:#5A2E17;
  --good:#6FD39B; --good-tint:#17301F; --grid:#2C2C2E; --sample-bg:#3A2A10; --sample-fg:#FFC970;
  --series-3:#6B4FA0; --series-dim:#636366; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,3.2vw,38px);line-height:1.1;font-weight:700;letter-spacing:-.025em}
h2{font-size:21px;font-weight:600;letter-spacing:-.015em}
h3{font-size:16px;font-weight:600;line-height:1.35}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}
.side{flex:0 0 248px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:28px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:baseline;padding:0 12px 24px;font-size:22px;letter-spacing:-.03em}
.logo b{color:var(--accent);font-weight:700}.logo span{color:var(--muted)}
.nav-group{padding:16px 12px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;text-align:left;font-size:15px;color:var(--fg);width:100%}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="page"]{background:var(--tint);color:var(--accent);font-weight:600}
.nav-btn svg{flex:0 0 20px}
.side-foot{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.theme-row{display:flex;gap:4px;padding:3px;background:var(--surface-2);border-radius:10px}
.theme-row button{flex:1;min-height:32px;border:0;border-radius:8px;background:transparent;font-size:12px;font-weight:600;color:var(--muted)}
.theme-row button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{flex:1;min-width:0;padding-block:36px 72px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.sample{padding:3px 9px;border-radius:999px;background:var(--sample-bg);color:var(--sample-fg);font-size:12px;font-weight:600}

.card{background:var(--surface);border-radius:22px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;min-width:0}
.card.hero{border-radius:26px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(63,0,124,.08)}
.card-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.sub{font-size:14px;color:var(--muted);margin-top:4px}
.grid{display:grid;gap:20px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(480px,100%),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:16px}
.g-4{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:16px}

.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px;width:fit-content;max-width:100%}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:500;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--fill);color:var(--on-fill);font-size:15px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.soft{background:var(--surface);color:var(--accent)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px;border-radius:10px}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:0;background:none;padding:0;color:var(--accent);font-size:15px;font-weight:600;align-self:flex-start}
.link:hover{text-decoration:underline}

.ai-mark{width:36px;height:36px;border-radius:10px;background:var(--fill);color:var(--on-fill);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.title-row{display:flex;align-items:center;gap:12px}
.brief{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:18px;background:var(--tint)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.brief p{font-size:14px;color:var(--fg-2);flex:1}

.kpi{background:var(--surface);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.kpi .l{font-size:13px;font-weight:500;color:var(--muted)}
.kpi svg{flex:0 1 96px;min-width:48px}
.kpi .v{white-space:nowrap;font-size:clamp(24px,2.2vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1;font-family:var(--font-display)}
.kpi .d{font-size:13px;font-weight:600}
.up{color:var(--good)}.down{color:var(--warn-fg)}

.ask{flex:0 1 440px;min-width:min(280px,100%);display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 16px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);color:var(--accent)}
.ask input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;color:var(--fg)}
.answer{display:flex;gap:14px;padding:18px 20px;border-radius:18px;background:var(--tint);align-items:flex-start}
.answer p{font-size:15px;color:var(--fg)}

.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
svg text{font-family:var(--font)}
.ax{fill:var(--muted);font-size:12px}
.gl{stroke:var(--grid)}
.lever{padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.lever .l{font-size:12px;color:var(--muted);font-weight:500}
.lever .v{font-size:15px;font-weight:600;margin-top:4px}

.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-row .top{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px}

.heat{min-width:720px;display:grid;grid-template-columns:190px repeat(6,minmax(0,1fr));gap:6px;font-size:14px}
.heat .hd{padding:4px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.heat .rn{display:flex;flex-direction:column;justify-content:center;min-height:52px}
.heat .rn small{font-size:12px;color:var(--muted)}
.cell{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:10px;font-weight:600}
.t1{background:var(--warn-strong);color:var(--warn-fg)}.t2{background:var(--warn-tint);color:var(--warn-fg)}
.t3{background:var(--surface-2);color:var(--fg)}.t4{background:var(--tint-strong);color:var(--accent)}.t5{background:var(--fill);color:var(--on-fill)}
.scroll-x{overflow-x:auto}

.dec{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding:18px 0;border-top:1px solid var(--line)}
.dec .main{flex:1 1 320px;min-width:0}
.dec .t{font-size:16px;font-weight:600;line-height:1.35}
.dec .o{font-size:13px;color:var(--muted)}
.dec .m{flex:0 0 160px;display:flex;flex-direction:column;gap:4px}
.dec .m small{font-size:12px;color:var(--muted)}
.chip-ok{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--good-tint);color:var(--good);font-weight:600}

.bullet{display:grid;grid-template-columns:130px minmax(0,1fr) 54px 84px;align-items:center;gap:12px}
.btrack{position:relative;height:22px;border-radius:6px;background:var(--surface-2)}
.btrack .b{position:absolute;inset:0 auto 0 0;border-radius:6px}
.btrack .tk{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--fg)}
.btrack .av{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}

.act{display:flex;gap:14px;padding:16px;border-radius:16px;background:var(--tint)}
.act .n{flex:0 0 28px;height:28px;border-radius:14px;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.p-acc{background:var(--surface);color:var(--accent)}
.p-tint{background:var(--tint-strong);color:var(--accent)}
.p-fill{background:var(--fill);color:var(--on-fill)}
.p-warn{background:var(--warn-strong);color:var(--warn-fg)}
.p-warn2{background:var(--warn-tint);color:var(--warn-fg)}
.p-grey{background:var(--surface-2);color:var(--fg)}

.table{min-width:860px;display:flex;flex-direction:column}
.tr{display:grid;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.tr.th{font-size:12px;font-weight:600;color:var(--muted);padding:8px 0}
.av-c{width:32px;height:32px;border-radius:16px;background:var(--tint);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 32px}

.plan-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--surface-2)}
.check{flex:0 0 28px;width:28px;height:28px;border-radius:14px;border:2px solid var(--series-dim);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;color:transparent}
.check[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.plan-item.done .pt{color:var(--muted);text-decoration:line-through}
.chat{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;padding-right:4px}
.bub{max-width:88%;padding:10px 14px;font-size:14px;line-height:1.5}
.bub.me{align-self:flex-end;background:var(--fill);color:var(--on-fill);border-radius:18px 18px 4px 18px}
.bub.ai{align-self:flex-start;background:var(--surface);color:var(--fg);border-radius:18px 18px 18px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:38px;padding:0 14px;border-radius:999px;border:0;background:var(--surface);color:var(--accent);font-size:13px;font-weight:600;box-shadow:0 0 0 1px var(--tint-strong)}
.chat-in{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 16px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--tint-strong)}
.chat-in input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px}
.icon-btn{width:36px;height:36px;border:0;border-radius:10px;background:var(--fill);color:var(--on-fill);display:flex;align-items:center;justify-content:center}
.stat{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.stat b{display:block;font-size:18px;line-height:1.1}
.stat small{font-size:12px;color:var(--muted)}
.ev{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
.date{flex:0 0 52px;height:52px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.date small{font-size:11px;font-weight:600;color:var(--muted)}.date b{font-size:18px}
.date.live{background:var(--fill);color:var(--on-fill)}.date.live small{color:var(--on-fill)}
.step{display:flex;gap:14px}
.step .rail{display:flex;flex-direction:column;align-items:center}
.step .dot{width:16px;height:16px;border-radius:8px;background:var(--series-dim)}
.step .dot.done{background:var(--accent-2)}
.step .dot.now{background:var(--surface);border:4px solid var(--accent-2);box-shadow:0 0 0 4px var(--tint)}
.step .ln{width:2px;flex:1;min-height:20px;background:var(--line)}
.step .ln.done{background:var(--accent-2)}
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.moods button{min-height:48px;border:0;border-radius:14px;background:var(--surface-2);font-size:14px;font-weight:600}
.moods button[aria-pressed="true"]{background:var(--fill);color:var(--on-fill)}

.hm{min-width:460px;display:grid;grid-template-columns:150px repeat(8,minmax(0,1fr));gap:4px;font-size:13px}
.hm .c{height:30px;border-radius:6px}
.e0{background:var(--warn)}.e1{background:var(--warn-strong)}.e2{background:var(--tint-strong)}.e3{background:var(--accent-2);opacity:.75}.e4{background:var(--accent-2)}

.phone-stage{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;justify-content:center}
.phone{width:390px;max-width:100%;height:800px;border-radius:48px;background:var(--bg);box-shadow:0 0 0 10px #1D1D1F,0 0 0 11px #3A3A3C,0 30px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.phone-body{flex:1;min-height:0;overflow-y:auto;padding:48px 18px 20px;display:flex;flex-direction:column;gap:14px}
.phone-tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px 22px;background:var(--surface);border-top:1px solid var(--line)}
.phone-tabs button{min-height:50px;border:0;background:transparent;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.phone-tabs button[aria-pressed="true"]{color:var(--accent)}
.pcard{padding:14px;border-radius:18px;background:var(--surface)}
.phone-notes{max-width:420px;display:flex;flex-direction:column;gap:14px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:all .25s ease;max-width:calc(100% - 32px);z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


textarea,select{font:inherit;color:inherit}

/* ---- OS additions ---- */
.portal{margin:0 6px 18px;position:relative}
.portal-btn{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:0;border-radius:14px;background:var(--surface-2);text-align:left}
.portal-btn .pa{width:34px;height:34px;border-radius:10px;background:var(--fill);color:var(--on-fill);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 34px}
.portal-btn b{display:block;font-size:14px;line-height:1.2}
.portal-btn small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.portal-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.18);padding:6px;z-index:30;display:flex;flex-direction:column;gap:2px}
.portal-menu button{display:flex;flex-direction:column;align-items:flex-start;min-height:48px;padding:8px 12px;border:0;border-radius:10px;background:transparent;text-align:left}
.portal-menu button:hover,.portal-menu button[aria-current="true"]{background:var(--tint)}
.portal-menu small{font-size:12px;color:var(--muted)}
.side-foot .reset{border:0;background:none;color:var(--muted);font-size:12px;text-align:left;padding:4px 0;min-height:32px}
.side-foot .reset:hover{color:var(--accent)}

.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;max-width:1240px;margin:0 auto 6px;position:relative}
.bell{position:relative;width:44px;height:44px;border:0;border-radius:12px;background:var(--surface);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.bell .dotc{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.notif{position:absolute;right:0;top:52px;width:min(380px,calc(100vw - 32px));background:var(--surface);border-radius:18px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.18);padding:10px;z-index:25;display:flex;flex-direction:column;gap:2px}
.notif .row{display:flex;gap:10px;padding:10px;border-radius:12px}
.notif .row.unread{background:var(--tint)}
.notif .row small{color:var(--muted);font-size:12px}
.who{font-size:13px;color:var(--muted)}

.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.flabel{font-size:13px;font-weight:600;color:var(--fg-2)}
.in,.sel,.ta{width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;color:var(--fg)}
.ta{min-height:90px;resize:vertical}
.in:focus,.sel:focus,.ta:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent-2)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}

.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line)}
.tbl-input{width:110px;min-height:36px;padding:6px 8px;border:0;border-radius:8px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);text-align:right;font-size:14px}

.switch{position:relative;width:51px;height:31px;border:0;border-radius:16px;background:var(--series-dim);padding:0;flex:0 0 51px;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:#34C759}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.list-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row small{display:block;color:var(--muted);font-size:13px}

.status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.s-ok{background:var(--good-tint);color:var(--good)}
.s-warn{background:var(--warn-tint);color:var(--warn-fg)}
.s-acc{background:var(--tint);color:var(--accent)}
.s-grey{background:var(--surface-2);color:var(--fg-2)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px}
.modal{background:var(--surface);border-radius:24px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{width:36px;height:36px;border:0;border-radius:18px;background:var(--surface-2);font-size:18px;line-height:1;color:var(--fg-2);flex:0 0 36px}

.course-layout{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px}
.sec-list{display:flex;flex-direction:column;gap:6px}
.sec-item{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:0;border-radius:12px;background:transparent;text-align:left;width:100%;font-size:14px}
.sec-item:hover{background:var(--surface-2)}
.sec-item[aria-current="true"]{background:var(--tint);color:var(--accent);font-weight:600}
.sec-item .ic{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 26px;color:var(--fg-2)}
.video{aspect-ratio:16/9;max-width:100%;border-radius:18px;background:linear-gradient(135deg,#2A0055,#3F007C 50%,#6D28D9);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;overflow:hidden}
.video .play{width:72px;height:72px;border-radius:36px;background:rgba(255,255,255,.18);border:0;color:#fff;display:flex;align-items:center;justify-content:center}
.video .bar{position:absolute;left:20px;right:20px;bottom:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.video .bar i{display:block;height:100%;border-radius:2px;background:#fff}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border:0;border-radius:12px;background:var(--surface-2);text-align:left;width:100%;font-size:15px}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent-2);background:var(--tint)}
.opt.right{box-shadow:inset 0 0 0 2px var(--good);background:var(--good-tint)}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--warn);background:var(--warn-tint)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:4px}
.cal .d{min-height:86px;border-radius:12px;background:var(--surface-2);padding:6px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;font-size:12px}
.cal .d.out{opacity:.4}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent-2)}
.cal .d[aria-pressed="true"]{background:var(--tint)}
.cal .ev-chip{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--surface);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.points-hero{border-radius:26px;padding:28px;background:var(--fill);color:var(--on-fill);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:24px;align-items:center}
.points-hero .big{font-size:56px;font-weight:700;letter-spacing:-.035em;line-height:1;font-family:var(--font-display)}
.points-hero .muted{opacity:.8;font-size:14px}
.tierbar{height:10px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
.tierbar i{display:block;height:100%;background:#fff;border-radius:5px}
.menu-item{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.cup{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--fg-2)}
.voucher{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px;border-radius:22px;background:var(--surface-2);text-align:center}
.voucher canvas{width:180px;height:180px;image-rendering:pixelated;background:#fff;border-radius:12px;padding:10px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.08em}

.clock{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:24px;align-items:center}
.clock .time{font-size:52px;font-weight:700;letter-spacing:-.03em;font-family:var(--font-display);line-height:1}
.loc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loc button{min-height:72px;border:0;border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:15px}
.loc button small{font-size:12px;color:var(--muted);font-weight:500}
.loc button[aria-pressed="true"]{background:var(--tint);box-shadow:inset 0 0 0 2px var(--accent-2);color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.person{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.person .grow{min-width:0;flex:1}
.person small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgrid{display:grid;grid-template-columns:150px repeat(22,minmax(18px,1fr));gap:3px;min-width:720px;font-size:12px}
.mgrid .c{height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.m-o{background:var(--accent-2);color:#fff}.m-r{background:var(--tint-strong);color:var(--accent)}.m-l{background:var(--warn-strong);color:var(--warn-fg)}.m-a{background:var(--warn);color:#fff}.m-w{background:var(--surface-2)}
.payslip{border-radius:18px;box-shadow:0 0 0 1px var(--line);padding:20px;display:flex;flex-direction:column;gap:12px}
.payslip .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.payslip .tot{font-weight:700;border-top:1px solid var(--line);padding-top:10px}
.range{width:100%;accent-color:var(--accent-2)}
.score-ring{width:110px;height:110px}
.cover-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.cover-map li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cover-map ul{list-style:none;margin:0;padding:0}
.post{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.av-l{width:40px;height:40px;border-radius:20px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 40px}
.idcard{border-radius:20px;padding:18px;background:var(--fill);color:var(--on-fill);display:flex;gap:14px;align-items:center}
.idcard canvas{width:84px;height:84px;background:#fff;border-radius:10px;padding:6px;image-rendering:pixelated}
.phone-body .seg button{min-height:34px;padding:0 12px;font-size:13px}

@media (max-width:900px){
  .app{flex-direction:column}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex:none;flex-direction:row;align-items:center;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .logo{padding:0 10px 0 0;font-size:19px}
  .nav-group,.side-foot{display:none}
  .portal{margin:0 6px 0 0;position:static}
  .portal-btn{min-height:40px;padding:4px 10px;white-space:nowrap}
  .portal-btn .pa{width:28px;height:28px;flex-basis:28px}
  .portal-btn small{display:none}
  .portal-menu{position:fixed;left:16px;right:16px;top:64px}
  .nav-btn{width:auto;white-space:nowrap;min-height:40px;padding:0 12px;font-size:14px}
  .nav-btn svg{display:none}
  main{padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .card{padding:20px}
  .bullet{grid-template-columns:96px minmax(0,1fr) 44px}
  .bullet .gp{display:none}
  .course-layout{grid-template-columns:minmax(0,1fr)}
  .cal .d{min-height:60px}
  .cal .ev-chip{display:none}
  .points-hero .big{font-size:44px}
}
/* org chart */
.org-scroll{overflow-x:auto;padding-bottom:8px}
ul.org,ul.org ul{display:flex;justify-content:center;margin:0;padding:22px 0 0;position:relative;list-style:none}
ul.org{padding-top:0;width:max-content;min-width:100%}
ul.org li{position:relative;padding:22px 3px 0;display:flex;flex-direction:column;align-items:center}
ul.org>li{padding-top:0}
ul.org li::before,ul.org li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:22px;border-top:2px solid var(--line)}
ul.org li::after{right:auto;left:50%;border-left:2px solid var(--line)}
ul.org li:only-child::before,ul.org li:only-child::after{display:none}
ul.org li:only-child{padding-top:22px}
ul.org>li:only-child{padding-top:0}
ul.org li:first-child::before,ul.org li:last-child::after{border:0}
ul.org li:last-child::before{border-right:2px solid var(--line);border-radius:0 8px 0 0}
ul.org li:first-child::after{border-radius:8px 0 0 0}
ul.org ul::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:2px solid var(--line)}
ul.org li:only-child::before{display:block;content:"";border:0;border-left:2px solid var(--line);width:0;left:50%;right:auto;height:22px}
ul.org>li:only-child::before{display:none}
.org-node{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:108px;max-width:140px;padding:9px 10px;border:0;border-radius:14px;font-size:12px;line-height:1.25;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.org-node b{font-size:11.5px}
.org-node{font-size:11px}
.org-node span{opacity:.92}
.org-node.team{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 2px var(--accent-2)}
.org-node.vac{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 2px var(--warn);border:0}
.org-node[aria-current="true"]{outline:3px solid var(--fg);outline-offset:2px}

/* ===== Student Gen Z mode: electric violet, lime and hot pink; Bricolage Grotesque display over Plus Jakarta Sans ===== */
body.gz{
  --bg:#F5F2FF; --surface:#FFFFFF; --surface-2:#EFEAFE; --fg:#15111F; --fg-2:#3D3650; --muted:#6B6480; --line:#E3DCF7;
  --accent:#6A1BE0; --accent-2:#7C3AED; --fill:#6A1BE0; --on-fill:#FFFFFF; --tint:#F0E8FF; --tint-strong:#DCCBFF;
  --lime:#C6F432; --lime-ink:#2B3A00; --pink:#FF4FA3; --pink-ink:#7A0B47; --sky:#7CC8FF;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Bricolage Grotesque","Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  --shadow:0 2px 6px rgba(76,29,149,.06),0 18px 40px rgba(76,29,149,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.gz{
  --bg:#0D0A17; --surface:#17122A; --surface-2:#221B3A; --fg:#F6F3FF; --fg-2:#D6CFEA; --muted:#A39BBE; --line:#2E2648;
  --accent:#B794FF; --accent-2:#9B6BFF; --fill:#7C3AED; --tint:#231A40; --tint-strong:#36285F; --lime-ink:#C6F432; --pink-ink:#FF8CC4; --shadow:none}}
:root[data-theme="dark"] body.gz{
  --bg:#0D0A17; --surface:#17122A; --surface-2:#221B3A; --fg:#F6F3FF; --fg-2:#D6CFEA; --muted:#A39BBE; --line:#2E2648;
  --accent:#B794FF; --accent-2:#9B6BFF; --fill:#7C3AED; --tint:#231A40; --tint-strong:#36285F; --lime-ink:#C6F432; --pink-ink:#FF8CC4; --shadow:none}
body.gz{background:var(--bg);font-family:var(--font)}
body.gz::before{background:var(--bg)}
body.gz h1{font-family:var(--font-display);font-weight:800;letter-spacing:-.035em;font-size:clamp(32px,4vw,48px);line-height:1.02}
body.gz h2{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;font-size:22px}
body.gz h3{font-family:var(--font-display);font-weight:700}
body.gz .kpi .v,body.gz .big,body.gz .time{font-family:var(--font-display);font-weight:800}
body.gz .card{border-radius:28px;box-shadow:var(--shadow)}
body.gz .card.hero{border-radius:32px}
body.gz .btn{border-radius:999px;font-weight:700;background:linear-gradient(135deg,#7C3AED,#C026D3);transition:transform .15s ease,filter .15s}
body.gz .btn:active{transform:scale(.96)}
body.gz .btn.ghost{background:var(--surface-2);color:var(--fg)}
body.gz .btn.soft{background:var(--surface);color:var(--accent)}
body.gz .btn.lime{background:var(--lime);color:#1A2300}
body.gz .seg{border-radius:999px;background:var(--surface-2)}
body.gz .seg button{border-radius:999px}
body.gz .brief{border-radius:22px}
body.gz .side{background:var(--surface);border-right:0;box-shadow:1px 0 0 var(--line)}
body.gz .nav-btn{border-radius:14px;font-weight:600}
body.gz .nav-btn[aria-current="page"]{background:linear-gradient(135deg,#7C3AED,#C026D3);color:#fff}
body.gz .portal-btn .pa{background:linear-gradient(135deg,#7C3AED,#FF4FA3)}
body.gz .sample{display:none}
body.gz .ai-mark{background:linear-gradient(135deg,#7C3AED,#FF4FA3);border-radius:12px}
body.gz .points-hero{background:linear-gradient(135deg,#5B21B6 0%,#9333EA 55%,#DB2777 100%);border-radius:32px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud-chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-family:var(--font-display);border:0;color:var(--fg)}
.hud-chip img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.hud-xp{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);min-width:200px}
.hud-xp .lv{width:32px;height:32px;border-radius:50%;background:var(--lime);color:#1A2300;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-display);font-size:14px}
.xpbar{flex:1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#7C3AED,#FF4FA3);position:relative;overflow:hidden}
.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shimmer 2.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

/* login */
.login{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#120A24;color:#fff;font-family:"Plus Jakarta Sans",-apple-system,Arial,sans-serif;overflow:auto}
.login video,.login .vfall{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.login .vfall{background:radial-gradient(circle at 30% 20%,#9333EA,#2A0E5A 60%,#120A24)}
.login .art{position:relative;overflow:hidden;min-height:100%}
.login .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,10,36,.1),rgba(18,10,36,.55))}
.login .hero-img{position:absolute;z-index:2;width:min(62%,420px);left:50%;top:52%;transform:translate(-50%,-50%);border-radius:32px;box-shadow:0 40px 80px rgba(0,0,0,.45);animation:float 6s ease-in-out infinite}
.login .tagline{position:absolute;z-index:2;left:max(32px,env(safe-area-inset-left,0px));bottom:36px;right:32px}
.login .tagline b{display:block;font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:800;font-size:clamp(34px,4.4vw,60px);line-height:.98;letter-spacing:-.04em}
.login .tagline .hl{background:#C6F432;color:#1A2300;padding:0 10px;border-radius:12px;display:inline-block;transform:rotate(-2deg)}
.login .panel{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:48px max(28px,env(safe-area-inset-right,0px)) 48px max(28px,env(safe-area-inset-left,0px));max-width:520px;width:100%;margin:0 auto}
.login .brand{display:flex;align-items:baseline;font-size:24px;letter-spacing:-.03em}
.login .brand b{font-weight:800}.login .brand span{opacity:.7}
.login h1{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:800;font-size:clamp(36px,4vw,52px);letter-spacing:-.04em;line-height:1;margin:0;color:#fff}
.login p{color:rgba(255,255,255,.75);margin:0;font-size:16px;line-height:1.5}
.login .field{display:flex;flex-direction:column;gap:8px}
.login label{font-size:13px;font-weight:700;color:rgba(255,255,255,.8)}
.login input.lin{height:56px;border-radius:18px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;padding:0 18px;font-size:17px;font-family:inherit;outline:none}
.login input.lin:focus{border-color:#C6F432;background:rgba(255,255,255,.12)}
.login .go{height:58px;border:0;border-radius:999px;background:#C6F432;color:#1A2300;font-weight:800;font-size:17px;font-family:inherit;cursor:pointer;transition:transform .15s}
.login .go:active{transform:scale(.97)}
.login .alt{height:52px;border-radius:999px;border:1.5px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.login .or{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.5);font-size:13px}.login .or::before,.login .or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.15)}
.login .otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.login .otp input{height:64px;text-align:center;font-size:26px;font-weight:800;border-radius:16px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-family:"Bricolage Grotesque",Arial,sans-serif;outline:none;min-width:0}
.login .otp input:focus{border-color:#C6F432}
.login .avs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.login .avs button{border:3px solid transparent;border-radius:24px;padding:0;overflow:hidden;background:none;cursor:pointer;aspect-ratio:1;transition:transform .15s}
.login .avs button img{width:100%;height:100%;object-fit:cover;display:block}
.login .avs button[aria-pressed="true"]{border-color:#C6F432;transform:scale(1.06)}
.login .tiny{font-size:12px;color:rgba(255,255,255,.55)}
.login .stickers{display:flex;flex-wrap:wrap;gap:8px}
.login .sticker{padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px}
@keyframes float{0%,100%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-50%,-54%) rotate(2deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.bob{animation:bob 3.2s ease-in-out infinite}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .art{min-height:46vh}.login .hero-img{width:min(46%,240px)}.login .tagline b{font-size:30px}}

/* store */
.store-hero{position:relative;border-radius:32px;overflow:hidden;min-height:240px;display:flex;align-items:flex-end;background:#2A0E5A}
.store-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.store-hero .txt{position:relative;padding:28px;color:#fff;background:linear-gradient(0deg,rgba(18,10,36,.75),transparent);width:100%}
.store-hero .txt b{display:block;font-family:var(--font-display);font-weight:800;font-size:clamp(28px,3.4vw,44px);letter-spacing:-.03em;line-height:1}
.prod{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);position:relative}
.prod .mono{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:20px}
.prod .save{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;background:var(--lime);color:#1A2300;font-weight:800;font-size:12px}
.prod .price{font-family:var(--font-display);font-weight:800;font-size:22px}
.prod .was{text-decoration:line-through;color:var(--muted);font-size:13px;margin-left:6px;font-weight:500}
.cart-fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;height:56px;padding:0 22px;border-radius:999px;border:0;background:linear-gradient(135deg,#7C3AED,#C026D3);color:#fff;font-weight:800;font-size:16px;box-shadow:0 14px 30px rgba(124,58,237,.45);display:flex;align-items:center;gap:10px}
.cart-fab b{background:var(--lime);color:#1A2300;border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px}

/* leagues */
.league-hero{border-radius:32px;overflow:hidden;position:relative;color:#fff;background:linear-gradient(135deg,#3B0A8C,#7C3AED 60%,#DB2777)}
.league-hero .in{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:24px}
.league-hero img.gem{width:110px;height:110px;object-fit:contain}
.league-hero b.t{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,3vw,38px);letter-spacing:-.03em;display:block;line-height:1}
.leagues{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.leagues span{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.15);font-size:12px;font-weight:700}
.leagues span.on{background:#C6F432;color:#1A2300}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px}
.lrow.me{background:linear-gradient(90deg,rgba(124,58,237,.14),rgba(255,79,163,.1));box-shadow:inset 0 0 0 2px var(--accent-2)}
.lrow img,.lrow .avx{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 44px}
.lrow .avx{display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--tint);color:var(--accent)}
.lrow .rk{width:30px;font-family:var(--font-display);font-weight:800;font-size:18px;text-align:center}
.zone{font-size:11px;font-weight:800;letter-spacing:.06em;padding:8px 12px;border-radius:12px;text-align:center}
.zone.up{background:rgba(198,244,50,.25);color:var(--lime-ink)}.zone.down{background:rgba(255,79,163,.14);color:var(--pink-ink)}
.podium-wrap{position:relative;border-radius:28px;overflow:hidden}
.podium-wrap>img{width:100%;display:block;max-height:280px;object-fit:cover}
.podium-faces{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;gap:9%;padding-top:4%}
.podium-faces div{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-weight:800;font-size:13px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.podium-faces img{width:clamp(44px,7vw,74px);height:clamp(44px,7vw,74px);border-radius:50%;border:3px solid #fff;object-fit:cover;box-shadow:0 8px 20px rgba(0,0,0,.35)}

/* daily drop + confetti */
.drop{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.drop img{width:110px;height:110px;object-fit:contain}
.drop.opened img{animation:pop .5s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.mascot-card{display:flex;align-items:center;gap:16px}
.mascot-card img{width:96px;height:96px;object-fit:contain;flex:0 0 96px}
.bubble{position:relative;padding:14px 18px;border-radius:20px;background:var(--surface-2);font-size:15px;line-height:1.45}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:var(--surface-2);border-left:0}
@media (prefers-reduced-motion:reduce){.bob,.login .hero-img,.xpbar i::after{animation:none}}
.bcover{aspect-ratio:2/3;width:100%;max-width:150px;border-radius:6px 14px 14px 6px;background:linear-gradient(135deg,var(--bc),color-mix(in srgb,var(--bc) 55%,#000));color:#fff;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.15);align-self:center}
.bcover .bt{font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1.1;letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.bcover .ba{font-size:10.5px;opacity:.85;font-weight:600;line-height:1.2}
.plan{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:22px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;color:var(--fg);cursor:pointer;transition:transform .15s}
.plan:hover{transform:translateY(-2px)}
.plan.on{box-shadow:inset 0 0 0 2.5px var(--accent-2);background:var(--tint)}
.plan b{font-family:var(--font-display);font-size:17px}
.plan .price{font-family:var(--font-display);font-weight:800;font-size:18px}.plan .price small{font-size:12px;color:var(--muted);font-weight:600}
.sched{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:12px;border-bottom:1px solid var(--line)}
.sched i{flex:1;border-radius:4px 4px 0 0;min-width:3px}
a.btn{text-decoration:none}a.btn:hover{text-decoration:none}
.sim-hero{position:relative;border-radius:32px;overflow:hidden;color:#fff;display:flex;align-items:center;gap:20px;padding:30px}
.sim-hero.ug{background:linear-gradient(135deg,#5B21B6,#9333EA 55%,#DB2777)}
.sim-hero.pro{background:linear-gradient(135deg,#1E1B3A,#3B2A6B);}
.sim-hero .in{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.sim-hero .kick{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.85}
.sim-hero .t{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,4vw,48px);letter-spacing:-.035em;line-height:1}
.sim-hero p{opacity:.88;max-width:60ch;font-size:16px}
.sim-hero img{width:150px;height:150px;object-fit:contain}
.sim-hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.card.memo{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:18px}
.card.memo h2{font-family:var(--font-display);letter-spacing:-.01em}
.event{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;background:var(--surface-2);border:0}
.event.ug{background:linear-gradient(90deg,rgba(255,79,163,.16),rgba(124,58,237,.12))}
.event b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.simopt{min-height:52px}
@media (max-width:700px){.sim-hero{flex-direction:column;align-items:flex-start}.sim-hero img{width:96px;height:96px}}

const APIT_BANDS=[[150000,0],[83333,.06],[41667,.18],[41667,.24],[41667,.30],[Infinity,.36]];
function apit(gross){let rem=gross,tax=0;for(const [w,r] of APIT_BANDS){const x=Math.min(rem,w);tax+=x*r;rem-=x;if(rem<=0)break;}return Math.round(tax);}
function teamStats(){const c=STAFF.filter(x=>x.enrol!=null);const e=c.reduce((a,b)=>a+b.enrol,0);return{enrol:e,conv:+(c.reduce((a,b)=>a+b.conv,0)/c.length).toFixed(1),resp:+(c.reduce((a,b)=>a+b.resp,0)/c.length).toFixed(1),n:c.length};}
function perfScore(s){
 const L=s.lect?LECT.find(l=>l.k===s.lect):null;let auto;
 if(L){auto=(Math.min(L.pass,100)*.35+(L.rating/5*100)*.25+L.onTime*.2+L.ret*.2);}
 else if(s.head){const t=teamStats();auto=Math.min(100,t.enrol/(S.inc.teamTarget||40)*100)*.5+Math.min(100,t.conv/14*100)*.3+Math.max(0,100-(t.resp-1)*8)*.2;}
 else if(s.enrol!=null){auto=Math.min(100,s.enrol/12*100)*.5+Math.min(100,s.conv/14*100)*.3+Math.max(0,100-(s.resp-1)*8)*.2;}
 else auto=s.okr||80;
 const rv=S.reviews[s.id];let man=rv?(rv.reduce((a,b)=>a+b,0)/rv.length)/5*100:(L?(L.rating/5*100):80);
 return Math.round(auto*.7+man*.3);
}
function incentive(s){
 const I=S.inc,L=s.lect?LECT.find(l=>l.k===s.lect):null,lines=[];
 if(L){
  if(L.pass>=I.lPass&&L.rating>=I.lRating)lines.push(['Quality bonus (pass ≥'+I.lPass+'% and rating ≥'+I.lRating+')',I.lQual]);
  if(L.onTime>=I.lMarkMin)lines.push(['On-time marking ≥'+I.lMarkMin+'%',I.lMark]);
  if(L.ret>=I.lRetMin)lines.push(['Class retention ≥'+I.lRetMin+'%',I.lRet]);
 } else if(s.head){
  const t=teamStats(),tg=I.teamTarget||40,hb=I.headBonus||60000,hp=I.headPer||1500;
  if(t.enrol>=tg){lines.push(['Team hit '+t.enrol+' of '+tg+' enrolments',hb]);if(t.enrol>tg)lines.push([(t.enrol-tg)+' team enrolments above target × '+fmt(hp),(t.enrol-tg)*hp]);}
 } else if(s.enrol!=null){
  const extra=Math.max(0,s.enrol-I.enrolThresh);if(extra)lines.push([extra+' enrolments above '+I.enrolThresh+' × '+fmt(I.perEnrol),extra*I.perEnrol]);
  if(s.conv>=I.convMin)lines.push(['Conversion '+s.conv+'% ≥ '+I.convMin+'%',I.convBonus]);
 } else {
  const sc=perfScore(s);if(sc>=I.staffMin)lines.push(['Performance '+sc+'/100 × '+I.staffPct+'% of basic',Math.round(s.basic*I.staffPct/100*sc/100)]);
 }
 return{total:lines.reduce((a,b)=>a+b[1],0),lines};
}
function pay(s){
 if(s.vacant)return{vacant:true,basic:0,allow:0,inc:0,nopay:0,gross:0,epf:0,epfEr:0,etf:0,tax:0,ded:0,net:0};
 const inp=S.payInputs[s.id]||{nopay:0,ded:0};
 if(s.type==='Visiting'){const fee=s.rate*s.hours,inc=S.incToPayroll?incentive(s).total:0;return{visiting:true,fee,inc,gross:fee+inc,epf:0,epfEr:0,etf:0,tax:0,ded:+inp.ded||0,nopay:0,net:fee+inc-(+inp.ded||0)};}
 const nopay=Math.round(s.basic/30*(+inp.nopay||0));
 const inc=S.incToPayroll?incentive(s).total:0;
 const epfBase=s.basic+s.allow-nopay;
 const gross=s.basic+s.allow+inc-nopay;
 const epf=Math.round(epfBase*.08),epfEr=Math.round(epfBase*.12),etf=Math.round(epfBase*.03),tax=apit(gross),ded=+inp.ded||0;
 return{basic:s.basic,allow:s.allow,inc,nopay,gross,epf,epfEr,etf,tax,ded,net:gross-epf-tax-ded};
}

 const Y=v=>260-v*12.5,cols=['var(--fill)','var(--accent-2)','var(--series-3)','var(--warn)'];

 const bars=raw.map((r,i)=>{const x=72+i*88;let y=260,out='';for(let k=1;k<=4;k++){const h=r[k]*12.5;y-=h;out+=`<rect x="${x}" y="${y.toFixed(1)}" width="50" height="${(h-1.5).toFixed(1)}" rx="3" fill="${cols[k-1]}" ${r[5]?'fill-opacity=".45"':''}/>`;}

}

/* Calendar */
function vCalendar(){

 const title=first.toLocaleString('en-GB',{month:'long',year:'numeric'});
 const cells=[];for(let i=0;i<42;i++){const d=new Date(y,m-1,1-start+i);cells.push(d);}
 const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const evs=S.events.filter(e=>e.d===S.calSel);
 const canEdit=S.portal!=='student';
 return `<div class="wrap fade">${head('Academic schedule','Calendar',`<div class="row-actions"><button class="btn ghost" data-act="calNav" data-arg="-1" aria-label="Previous month">‹</button><b style="min-width:140px;text-align:center">${title}</b><button class="btn ghost" data-act="calNav" data-arg="1" aria-label="Next month">›</button><button class="btn ghost" data-act="calToday">Today</button></div>`)}
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))">
 <section class="card"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dh">${d}</div>`).join('')}
 ${cells.slice(0,start+days>35?42:35).map(d=>{const k=iso(d),es=S.events.filter(e=>e.d===k);return `<button class="d ${d.getMonth()!==m-1?'out':''} ${k==='2026-10-25'?'today':''}" aria-pressed="${k===S.calSel}" data-act="calPick" data-arg="${k}" aria-label="${d.toDateString()}, ${es.length} events"><b>${d.getDate()}</b>${es.slice(0,2).map(e=>`<span class="ev-chip" style="${e.k==='due'?'color:var(--warn-fg)':''}">${esc(e.t)}</span>`).join('')}${es.length>2?`<span style="font-size:11px;color:var(--muted)">+${es.length-2} more</span>`:''}</button>`}).join('')}</div></section>

function ring(score){const C=2*Math.PI*46,v=score/100*C;return `<svg class="score-ring" viewBox="0 0 110 110" role="img" aria-label="Score ${score} of 100"><circle cx="55" cy="55" r="46" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="55" cy="55" r="46" fill="none" stroke="${score>=70?'var(--accent-2)':'var(--warn)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${v.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" style="font-size:26px;font-weight:700;fill:var(--fg)">${score}</text></svg>`;}
function kpisFor(s){const L=s.lect?LECT.find(l=>l.k===s.lect):null;
 if(L)return[['Pass rate',L.pass+'%',L.pass/100,'35%'],['Student rating',L.rating+' / 5',L.rating/5,'25%'],['On-time marking',L.onTime+'%',L.onTime/100,'20%'],['Class retention',L.ret+'%',L.ret/100,'20%']];
 if(s.enrol!=null)return[['Enrolments',s.enrol+' this month',Math.min(1,s.enrol/12),'50%'],['Lead conversion',s.conv+'%',Math.min(1,s.conv/14),'30%'],['First response time',s.resp+' h',Math.max(0,1-(s.resp-1)*.08),'20%']];
 return[['Goals (OKRs) achieved',s.okr+'%',s.okr/100,'100%']];}
function scorecard(s,editable){

 return `<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center">${ring(sc)}<div style="flex:1;min-width:200px"><h2>${s.name}</h2><div class="who">${s.role} · reviewed by ${s.manager}</div><div style="margin-top:8px">${sc>=85?'<span class="status s-acc">Star performer</span>':sc>=70?'<span class="status s-ok">On track</span>':'<span class="status s-warn">Needs support</span>'} <span class="status s-grey">Incentive ${lkr(inc.total)}</span></div></div></div>
 <h3>Live KPIs · 70% of score</h3>${kpisFor(s).map(k=>`<div class="bar-row"><div class="top"><span>${k[0]} <span class="who">· weight ${k[3]}</span></span><b class="num">${k[1]}</b></div><div class="track"><i style="width:${Math.round(k[2]*100)}%;background:${k[2]>=.75?'var(--accent-2)':'var(--warn)'}"></i></div></div>`).join('')}
 <h3>Manager review · 30% of score</h3>${['Quality of work','Collaboration','Ownership','Student focus'].map((c,i)=>`<div class="f"><label for="rv${i}">${c}: <b>${rv[i]} / 5</b></label><input id="rv${i}" class="range" type="range" min="1" max="5" step="1" value="${rv[i]}" ${editable?`data-change="review" data-arg="${s.id}|${i}"`:'disabled'}></div>`).join('')}`;
}

function confetti(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;let c=$('#confetti');if(!c){c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);}
 const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#7C3AED','#C6F432','#FF4FA3','#7CC8FF','#FFC94D'];
 const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,s:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);x.restore();});if(++t<110)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}

 else if(d.go){closeModal();handleGo(d.go);}
 else if(d.themeSet)setTheme(d.themeSet);
